name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (typecheck, tests, production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Throwaway TEST C2PA chain for the C2PA tests (never a real signing identity).
      - run: sh scripts/c2pa-testcert.sh
      - run: pnpm typecheck
      - run: pnpm test
      # No Google project in CI: pages render their "not configured" states.
      - run: pnpm build
